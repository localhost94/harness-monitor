name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # The Windows app and the Linux agent are two halves of one download: the
  # .exe runs the agent inside WSL, so a release is useless without both.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # --features custom-protocol is mandatory: without it the shipped binary
      # points the webview at devUrl and opens on "localhost failed to connect".
      - name: Build x64 binary
        working-directory: src-tauri
        run: cargo build --release --features custom-protocol --target x86_64-pc-windows-msvc
      - name: Stage artifact
        run: |
          mkdir -p out
          cp src-tauri/target/x86_64-pc-windows-msvc/release/harness-monitor.exe out/harness-monitor-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: out/harness-monitor-x64.exe

  # Two Linux agents, because the app runs the agent inside WSL: an ARM64
  # Windows machine has an aarch64 WSL, where an x86_64 agent cannot run.
  linux-agent:
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Build frontend
        run: |
          bun install --frozen-lockfile
          bun run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Build agent
        working-directory: src-tauri
        run: cargo build --release --features custom-protocol
      - name: Stage artifact
        run: |
          mkdir -p out
          cp src-tauri/target/release/harness-monitor out/harness-monitor-agent-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux-agent-${{ matrix.arch }}
          path: out/harness-monitor-agent-${{ matrix.arch }}

  # macOS needs no agent half: bridge.rs dispatches on cfg!(windows), so a mac
  # build runs the adapters in-process the way the Linux build does. One
  # universal .dmg covers Apple Silicon and Intel, so there is no arch table.
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # `tauri build` (not raw cargo) because we need the .app/.dmg bundler, and
      # it turns on custom-protocol itself. It also runs beforeBuildCommand, so
      # the frontend is built here rather than in a step of its own.
      - name: Build universal .dmg
        env:
          # Unsigned is deliberate (no Apple Developer Program), but Apple
          # Silicon refuses a binary with no signature at all - ad-hoc is enough
          # to launch. Users still have to clear the quarantine flag.
          APPLE_SIGNING_IDENTITY: "-"
        run: bun x tauri build --target universal-apple-darwin --bundles dmg
      # Globbed: tauri names it HarnessMonitor_<version>_universal.dmg, which
      # would go stale on the next version bump.
      - name: Stage artifact
        run: |
          mkdir -p out
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            out/HarnessMonitor-universal.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: out/HarnessMonitor-universal.dmg

  publish:
    needs: [windows, linux-agent, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Attach binaries to the release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/windows-x64/harness-monitor-x64.exe
            dist/linux-agent-x64/harness-monitor-agent-x64
            dist/linux-agent-arm64/harness-monitor-agent-arm64
            dist/macos-universal/HarnessMonitor-universal.dmg
